name: selfcheck

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend selfcheck
        run: node scripts/selfcheck.mjs
      - name: API contract selfcheck
        run: node scripts/api-contract-selfcheck.mjs
      - name: Items selfcheck
        run: node scripts/items-selfcheck.mjs
      - name: Analytics selfcheck
        run: node scripts/analytics-selfcheck.mjs
      - name: Account delete selfcheck
        run: node scripts/account-delete-selfcheck.mjs
      - name: Era selfcheck
        run: node scripts/era-selfcheck.mjs
      - name: Rebirth selfcheck
        run: node scripts/rebirth-selfcheck.mjs
      - name: Rebirth speed selfcheck
        run: node scripts/rebirth-speed-selfcheck.mjs
      - name: Branding selfcheck
        run: node scripts/branding-selfcheck.mjs
      - name: Own numbers selfcheck
        run: node scripts/own-numbers-selfcheck.mjs
      - name: Own balance selfcheck
        run: node scripts/own-balance-selfcheck.mjs
      - name: Auth security selfcheck
        run: node scripts/auth-security-selfcheck.mjs
      - name: Save forward-compat selfcheck
        run: node scripts/save-forward-selfcheck.mjs
      - name: Release package selfcheck
        run: node scripts/release-selfcheck.mjs
      - name: First screen selfcheck
        run: node scripts/first-screen-selfcheck.mjs
      - name: Service worker selfcheck
        run: node scripts/sw-selfcheck.mjs
      - name: Gameplay fun selfcheck
        run: node scripts/gameplay-fun-selfcheck.mjs
      - name: Cloud save selfcheck
        run: node scripts/cloud-save-selfcheck.mjs
      - name: Newbie path selfcheck
        run: node scripts/newbie-path-selfcheck.mjs
      - name: Restart P1-P13 selfcheck
        run: node scripts/restart-p1-p13-selfcheck.mjs
      - name: Migrations selfcheck
        run: node scripts/migrations-selfcheck.mjs
      - name: Install deps
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Playwright smoke
        run: node scripts/playwright-smoke.mjs
      - name: Player sim (6h)
        run: node scripts/player-sim.mjs
        env:
          SIM_HOURS: "6"
          SIM_DT: "30"
      - name: E2E smoke
        run: node scripts/e2e-smoke.mjs
